<script>// ===== 저장소 =====
// 대화창의 window.storage와 똑같은 모양으로 맞춰서, 앱 코드는 그대로 두고 속만 바꿨다.
//   shared=false → 이 기기에만 저장 (localStorage)
//   shared=true  → Firebase에 저장해서 가족과 공유
//
// 키에 쓰는 ':' 는 Firestore 문서 이름에 쓸 수 없어 '__'로 바꾼다.
const docId = (key) => key.replace(/[:/]/g, "__");

window.storage = {
  async get(key, shared = false) {
    if (!shared) {
      const v = localStorage.getItem(key);
      return v == null ? null : { key, value: v, shared };
    }
    const snap = await FB.getDoc(FB.doc(FB.db, "store", docId(key)));
    if (!snap.exists()) throw new Error("not found");
    return { key, value: snap.data().value, shared };
  },

  async set(key, value, shared = false) {
    if (!shared) {
      localStorage.setItem(key, value);
      return { key, value, shared };
    }
    await FB.setDoc(FB.doc(FB.db, "store", docId(key)), {
      value,
      updatedAt: Date.now(),
    });
    return { key, value, shared };
  },

  async delete(key, shared = false) {
    if (!shared) {
      localStorage.removeItem(key);
      return { key, deleted: true, shared };
    }
    await FB.deleteDoc(FB.doc(FB.db, "store", docId(key)));
    return { key, deleted: true, shared };
  },
};

// 실시간 반영: 가족 데이터 문서가 바뀌면 곧바로 알려준다.
// (앱의 20초 폴링은 그대로 두되, 이쪽이 먼저 반응해서 체감 지연이 사라진다)
window.watchKey = (key, cb) =>
  FB.onSnapshot(FB.doc(FB.db, "store", docId(key)), (snap) => {
    if (snap.exists()) cb(snap.data().value);
  });
</script>

// 아이폰 사파리는 저장 위치를 고를 수 없어, 공유 시트를 띄워

async function saveOrShare(filename, text, mime) {
  const file = new File([text], filename, {

    files: [file]

    try {
      await navigator.share({
        files: [file],
        title: filename

    } catch (e) {
      if (e && e.name === "AbortError") return null; // 사용자가 닫음

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename
      });
      const w = await handle.createWritable();
      await w.write(file);
      await w.close();
      return "저장했어요.";
    } catch (e) {
      if (e && e.name === "AbortError") return null;
    }
  }

  try {
    const url = URL.createObjectURL(file);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

<script>// ===== 앱 띄우기 =====
// Firebase가 준비되면 앱을 띄운다.
// 설정이 비어 있거나 연결이 실패하면, 로딩 화면에 갇히지 않고 원인을 보여준다.
(function () {
  let booted = false;

  function boot() {
    if (booted) return;
    booted = true;
    try {
      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    } catch (e) {
      showError("앱을 띄우는 중 오류가 났어요.", e && e.message);
    }
  }

  function showError(title, detail) {
    if (booted) return;
    booted = true;
    document.getElementById("root").innerHTML =
      '<div style="max-width:420px;margin:0 auto;padding:40px 20px;font-family:sans-serif;color:#111">' +
      '<h1 style="font-size:18px;margin:0 0 12px">' + title + "</h1>" +
      '<p style="font-size:14px;line-height:1.7;color:#525252">' +
      "index.html 안의 <b>firebaseConfig</b> 6줄이 아직 <b>여기에_붙여넣기</b> 상태인지 확인해 주세요.<br><br>" +
      "이미 채우셨다면 Firebase 콘솔에서 아래 두 가지를 확인하세요.<br>" +
      "· Authentication → 로그인 방법 → <b>익명</b> 사용 설정<br>" +
      "· Firestore Database → 규칙 게시 여부" +
      "</p>" +
      (detail ? '<pre style="font-size:11px;color:#A3A3A3;white-space:pre-wrap;margin-top:16px">' + detail + "</pre>" : "") +
      "</div>";
  }

  window.__gajokBootError = showError;

  if (window.FB) boot();
  else window.addEventListener("firebase-ready", boot, { once: true });

  // 8초 안에 준비되지 않으면 안내를 띄운다 (무한 로딩 방지)
  setTimeout(function () {
    if (!booted) showError("Firebase에 연결하지 못했어요.");
  }, 8000);
})();

// 모듈 스크립트가 먼저 실패한 경우 처리
if (window.__gajokFirebaseError) {
  window.__gajokBootError("Firebase에 연결하지 못했어요.", window.__gajokFirebaseError.message);
}
</script>
