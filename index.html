<script>
// ===== 저장소 =====
// 대화창의 window.storage와 똑같은 모양으로 맞춰서, 앱 코드는 그대로 두고 속만 바꿨다.
//   shared=false → 이 기기에만 저장 (localStorage)
//   shared=true  → Firebase에 저장해서 가족과 공유
//
// 키에 쓰는 ':' 는 Firestore 문서 이름에 쓸 수 없어 '__'로 바꾼다.
const docId = (key) => key.replace(/[:/]/g, "__");

window.storage = {
  async get(key, shared = false) {
    if (!shared) {
      const v = localStorage.getItem(key);
      return v == null ? null : { key, value: v, shared };
    }
    const snap = await FB.getDoc(FB.doc(FB.db, "store", docId(key)));
    if (!snap.exists()) throw new Error("not found");
    return { key, value: snap.data().value, shared };
  },

  async set(key, value, shared = false) {
    if (!shared) {
      localStorage.setItem(key, value);
      return { key, value, shared };
    }
    await FB.setDoc(FB.doc(FB.db, "store", docId(key)), {
      value,
      updatedAt: Date.now(),
    });
    return { key, value, shared };
  },

  async delete(key, shared = false) {
    if (!shared) {
      localStorage.removeItem(key);
      return { key, deleted: true, shared };
    }
    await FB.deleteDoc(FB.doc(FB.db, "store", docId(key)));
    return { key, deleted: true, shared };
  },
};

// 실시간 반영: 다른 기기가 문서를 바꾸면 곧바로 알려준다.
// 반환값은 구독 해지 함수. 실패하면 콘솔에 남긴다.
window.watchKey = (key, cb) => {
  if (!window.FB) return null;
  try {
    return FB.onSnapshot(
      FB.doc(FB.db, "store", docId(key)),
      (snap) => {
        // 내 기기에서 쓴 직후 로컬 반영분은 건너뛴다 (서버 확정본만 사용)
        if (snap.metadata && snap.metadata.hasPendingWrites) return;
        if (snap.exists()) cb(snap.data().value);
      },
      (err) => console.error("실시간 구독 실패:", key, err)
    );
  } catch (e) {
    console.error("실시간 구독 오류:", e);
    return null;
  }
};

</script>

function ruleSlotToSlot(ruleSlot, age) {
  const adult = age >= MINOR_AGE;
  switch (ruleSlot) {
    case "empty":
      return "wake";
    case "breakfast":
      return adult ? "lunchAfter" : "bfAfter";
    case "lunch":
      return adult ? "dinBefore" : "lunchAfter";
    case "dinner":
      return "dinAfter";
    case "night":
      return "bed";
    default:
      return "bfAfter";
  }
}

// 예전에 시각으로만 저장된 항목을 가장 가까운 슬롯에 붙인다.
function slotFromTime(time, slotTimes) {
  const t = toMinutes(time || "08:00");
  let best = SLOT_ORDER[0];
  let gap = Infinity;
  SLOT_ORDER.forEach(k => {
    const d = Math.abs(toMinutes(slotTimes[k]) - t);
    if (d < gap) {
      gap = d;
      best = k;
    }
  });
  return best;
}

})();
